.closest('.calc');$$('input,select',box).forEach(x=>x.oninput=()=>{if((page==='laminates'&&x.id===p+'product')||(page==='pouches'&&x.id===p+'laminate'))refillThickness(page,p);updateOne(page,p)});refillThickness(page,p);updateOne(page,p)})}if(page==='producing'){['pr_supplier','pr_service','pr_width','pr_volume'].forEach(id=>$('#'+id).onchange=()=>productionRefresh());productionRefresh()}}
